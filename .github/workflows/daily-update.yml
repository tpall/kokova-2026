name: Kõkõva 2026 daily update

on:
  schedule:
    # 04:00 UTC = 07:00 EEST — after the overnight model runs, before riding.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      run_outlook:
        description: 'Also regenerate the ERA5 climatology outlook (slow, rarely changes)'
        type: boolean
        default: false
  push:
    paths:
      - 'R/**'
      - 'gpsweather/**'
      - Makefile
      - data/**
      - .github/workflows/daily-update.yml

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 30 rather than 20: a cold RSPM cache alone has eaten >16 min.
    timeout-minutes: 30

    steps:
      # Checkout is required so the daily commit lands on the repo, which also
      # keeps the schedule alive — GitHub disables crons after 60 days of repo
      # inactivity, and the daily commit prevents that.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Setup R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            dplyr
            tibble
            purrr
            tidyr
            readr
            xml2
            httr2
            jsonlite

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Python dependencies (route outlook)
        run: pip install numpy requests

      - name: Ferry schedules, weather forecast, route outlook
        run: make daily

      - name: Climatology outlook
        if: inputs.run_outlook
        run: make outlook

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports output data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: ferry + weather update $(date -u +%Y-%m-%d)"
          # Every report embeds its generation timestamp, so each run produces a
          # diff and tries to push. Any commit that lands in between — a manual
          # one, or a queued second run — then rejects this push as non-fast-
          # forward, so rebase and retry rather than failing the job.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt), rebasing on origin/main ..."
            # Any conflict is between two regenerations of the same output
            # files, where this run's version is the newer one — during a
            # rebase, -X theirs keeps the replayed (our) side. Abort a
            # half-applied rebase so the next attempt starts clean.
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
